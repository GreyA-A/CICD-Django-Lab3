name: Django Docker CI/CD

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build and run Docker containers
      # Автоматична збірка та запуск контейнера у фоновому режимі (-d)
      run: docker-compose up -d --build

    - name: Wait for services to be ready
      # Даємо серверу кілька секунд на повний запуск
      run: sleep 5

    - name: Run Pytest inside the container
      # Виконуємо тести безпосередньо у працюючому веб-контейнері
      run: docker-compose exec -T web pytest -v